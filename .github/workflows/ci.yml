name: MarketTracker CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-format:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv & Python 3.12
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Check Ruff Formatting
        run: uv run ruff format --check .

  test-and-bench:
    name: Test Suite & Performance Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv & Python 3.12
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv pip install -e ".[dev]"

      - name: Start ClickHouse Container
        run: |
          docker compose up -d clickhouse
          echo "Waiting for ClickHouse health..."
          timeout 60s bash -c 'until [ "$(docker inspect -f {{.State.Health.Status}} market_tracker_clickhouse)" == "healthy" ]; do sleep 1; done'
          echo "ClickHouse is healthy!"

      - name: Run Unit, Smoke & Hypothesis Property Tests
        run: uv run pytest tests/ -v

      - name: Run Mark-to-Market Performance Ladder
        run: uv run python bench/mtm.py

      - name: Run L2 Orderbook Latency Benchmark
        run: uv run python bench/book.py

      - name: Run Chaos Harness
        run: uv run python chaos/run_chaos.py

  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Web Dependencies
        working-directory: web
        run: npm ci

      - name: Build TypeScript / Vite Frontend
        working-directory: web
        run: npm run build

